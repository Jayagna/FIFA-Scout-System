# Refreshes rumours/rumours.json every two months (transfer rumours are sparse week to
# week, and the sources searched keep about three months of headlines). Run it by hand
# from the Actions tab with "Run workflow".
name: Refresh transfer rumours

on:
  schedule:
    # 03:17 UTC on the 1st to 5th of Jan, Mar, May, Jul, Sep, Nov: GDELT allows only so
    # many searches per hour from GitHub's machines, so each run carries on where the
    # previous one stopped (rumours/headlines.json); once every club has been searched,
    # the remaining runs that cycle finish straight away
    - cron: "17 3 1-5 */2 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rumours
  cancel-in-progress: false

jobs:
  rumours:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy pandas scipy scikit-learn
      - name: Download the newest edition's player file
        run: python scripts/download_data.py --only players_26.csv
      - name: Fetch and match headlines
        env:
          PYTHONUNBUFFERED: "1"
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python scripts/fetch_rumours.py
      - name: Commit the new feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rumours/rumours.json rumours/headlines.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh transfer rumours ($(date -u +%Y-%m-%d))"
          # main may have moved while this ran (it takes ~15 min): replay on top and retry
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
